<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FindVision AI 통계</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header><span class="badge">ADMIN</span><h1>사용 통계</h1>
      <p>개인정보와 재난문자 원문을 저장하지 않는 익명 집계입니다.</p></header>
    <section class="card">
      <label for="token">관리자 토큰</label>
      <input id="token" type="password" autocomplete="current-password" placeholder="FINDVISION_ADMIN_TOKEN">
      <div class="actions"><button id="load">통계 불러오기</button></div>
      <p id="status" role="status"></p>
    </section>
    <section class="stats hidden" id="stats" aria-live="polite"></section>
    <section class="card"><h2>리텐션 기준</h2><p class="muted">한국 날짜 기준입니다. 재방문율은 서로 다른 날짜에 다시 방문한 익명 브라우저 비율입니다. D1은 첫 방문 다음 날, D7은 첫 방문 후 1~7일 안에 다시 방문한 비율입니다. 쿠키 삭제·시크릿 모드·다른 기기는 별도 사용자로 계산됩니다.</p></section>
    <p><a href="/">← 이미지 생성 화면</a></p>
  </main>
  <script src="/static/admin.js"></script>
</body>
</html>
