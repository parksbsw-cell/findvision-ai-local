[project]
name = "findvision-ai-local"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<1",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "pillow>=10.4,<12",
  "python-multipart>=0.0.12,<1",
]

[project.optional-dependencies]
gpu = [
  "torch>=2.5",
  "diffusers>=0.32",
  "transformers>=4.46",
  "accelerate>=1.1",
  "safetensors>=0.4",
]
dev = ["pytest>=8.3", "ruff>=0.8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["app*"]

